# Studio + Backlot in one container.
#   cp .env.example .env      # add API keys (optional; free tools work without)
#   docker compose up --build
#   open http://localhost:4750/studio
#
# The agent (Claude Code, Codex, ...) runs on your machine, not in this
# container; it writes into ./projects and Studio shows it live.

services:
  openmontage:
    build:
      context: .
      args:
        INSTALL_REMOTION: "1"   # "0" skips Remotion + Chrome (smaller image)
        UID: "1000"             # match your host user so ./projects stays writable
    image: openmontage:latest
    container_name: openmontage
    restart: unless-stopped
    ports:
      # Loopback only: Backlot has no login, so never publish it on 0.0.0.0.
      - "127.0.0.1:${BACKLOT_PORT:-4750}:4750"
    env_file:
      - path: .env
        required: false
    environment:
      BACKLOT_HOST: 0.0.0.0
      BACKLOT_PORT: "4750"
      MUSIC_LIBRARY_DIR: /app/music_library
      # Keys come from .env; Studio cannot rewrite a file outside the container.
      STUDIO_READONLY_ENV: "1"
    volumes:
      - ./projects:/app/projects
      - ./music_library:/app/music_library
      - backlot-cache:/app/.backlot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4750/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backlot-cache:
